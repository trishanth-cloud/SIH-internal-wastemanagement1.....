    <!-- 🔒 Secure Route Guard Enforcement Link -->
    <script type="module" src="./js/auth-guard.js"></script>

    <!-- Real-Time Firebase Cloud Operations Script -->
    <script type="module">
        import { db, collection, addDoc, onSnapshot } from "./js/firebase-config.js";
        import { getAuth, signOut } from "https://gstatic.com";

        const auth = getAuth();
        const wasteCollectionRef = collection(db, "waste_requests");

        // Cloud listener: Watches database items and calculates totals automatically
        function syncUserDashboard() {
            onSnapshot(wasteCollectionRef, (snapshot) => {
                const body = document.getElementById('itemsTableBody');
                body.innerHTML = '';

                if (snapshot.empty) {
                    body.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-slate-400">No recycled items tracked yet.</td></tr>`;
                    updateStats(0, 0);
                    return;
                }

                let totalCount = 0;
                let totalWeight = 0;

                snapshot.forEach(documentSnapshot => {
                    const item = documentSnapshot.data();
                    totalCount++;
                    totalWeight += parseFloat(item.weight || 0);

                    // Map badge colors beautifully based on state conditions
                    let statusBadgeColor = "bg-amber-100 text-amber-800";
                    if (item.status === "COLLECTED") statusBadgeColor = "bg-blue-100 text-blue-800";
                    if (item.status === "RECYCLED") statusBadgeColor = "bg-emerald-100 text-emerald-800";

                    body.innerHTML += `
                        <tr class="border-b border-slate-50 hover:bg-slate-50/50 transition-all">
                            <td class="py-3 px-4 font-medium text-slate-800">${item.type || "N/A"}</td>
                            <td class="py-3 px-4 text-slate-600">${item.weight || 0} kg</td>
                            <td class="py-3 px-4">
                                <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${statusBadgeColor}">${item.status || "PENDING"}</span>
                            </td>
                            <td class="py-3 px-4 text-slate-400">${item.date || "Just now"}</td>
                        </tr>`;
                });

                updateStats(totalCount, totalWeight);
            });
        }

        function updateStats(count, weight) {
            document.getElementById('statTotalItems').innerText = `${count} item${count !== 1 ? 's' : ''}`;
            document.getElementById('statTotalWeight').innerText = `${weight.toFixed(1)} kg`;
            document.getElementById('statPoints').innerText = `${Math.floor(weight * 10)} pts`;
        }

        // Handle structural new item creation and write straight to firestore
        document.getElementById('addItemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const today = new Date();
            const formattedDate = String(today.getDate()).padStart(2, '0') + '-' + String(today.getMonth()+1).padStart(2, '0') + '-' + today.getFullYear();

            try {
                await addDoc(wasteCollectionRef, {
                    type: document.getElementById('itemType').value,
                    weight: parseFloat(document.getElementById('itemWeight').value),
                    address: document.getElementById('pickupAddress').value,
                    date: formattedDate,
                    status: "PENDING"
                });
                
                document.getElementById('reportModal').classList.add('hidden');
                document.getElementById('addItemForm').reset();
            } catch (err) {
                console.error("Database write rejection: ", err);
            }
        });

        // Safe account logging termination action routine
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await signOut(auth);
                window.location.href = "index.html";
            } catch (err) {
                alert("Logout calculation failure: " + err.message);
            }
        });

        window.onload = syncUserDashboard;
    </script>
</body>
</html>
