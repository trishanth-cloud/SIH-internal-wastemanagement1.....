<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - EcoTrack</title>
    <!-- Tailwind CSS CDN Engine -->
    <script src="https://tailwindcss.com"></script>
    <!-- FontAwesome Library for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-slate-50 min-h-screen flex font-sans">

    <!-- Left Navigation Sidebar -->
    <aside class="w-64 bg-slate-900 text-white p-6 flex flex-col justify-between hidden md:flex min-h-screen sticky top-0">
        <div>
            <h2 class="text-xl font-bold text-emerald-400 tracking-tight mb-8"><i class="fa-solid fa-leaf mr-2"></i>EcoTrack Portal</h2>
            <nav class="space-y-2">
                <a href="#" class="block px-4 py-2 bg-slate-800 text-emerald-400 rounded-lg font-medium"><i class="fa-solid fa-chart-pie mr-2"></i>Dashboard</a>
                <a href="admin.html" class="block px-4 py-2 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition"><i class="fa-solid fa-lock mr-2"></i>Admin View</a>
            </nav>
        </div>
        <!-- Secure Log Out Action Trigger -->
        <button id="logoutBtn" class="text-left text-sm text-slate-400 hover:text-rose-400 transition bg-transparent border-none outline-none cursor-pointer">
            <i class="fa-solid fa-right-from-bracket mr-2"></i>Log Out
        </button>
    </aside>

    <!-- Main Workspace Frame -->
    <main class="flex-1 p-8">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Welcome Back, Innovator!</h1>
                <p class="text-slate-500 text-sm">Track and manage your electronic waste contributions.</p>
            </div>
            <button onclick="document.getElementById('reportModal').classList.remove('hidden')" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-emerald-700 transition shadow-sm">+ Recycle Item</button>
        </header>

        <!-- Live Analytic Aggregation Summary Metrics -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm">
                <p class="text-sm font-medium text-slate-400 uppercase tracking-wider">Total Waste Logged</p>
                <p class="text-3xl font-bold text-slate-800 mt-2" id="statTotalItems">0 items</p>
            </div>
            <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm">
                <p class="text-sm font-medium text-slate-400 uppercase tracking-wider">Diverted from Landfills</p>
                <p class="text-3xl font-bold text-emerald-600 mt-2"><span id="statTotalWeight">0.0</span> kg</p>
            </div>
            <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm">
                <p class="text-sm font-medium text-slate-400 uppercase tracking-wider">Eco-Points Earned</p>
                <p class="text-3xl font-bold text-amber-500 mt-2"><span id="statPoints">0</span> pts</p>
            </div>
        </section>

        <!-- Active User Data Tracking Grid -->
        <section class="bg-white rounded-xl border border-slate-100 p-6 shadow-sm">
            <h3 class="font-bold text-slate-800 mb-4 text-lg">Your Submissions</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-100 text-slate-400 text-sm">
                            <th class="py-3 px-4">Item Details</th>
                            <th class="py-3 px-4">Weight (kg)</th>
                            <th class="py-3 px-4">Status</th>
                            <th class="py-3 px-4">Date Logged</th>
                        </tr>
                    </thead>
                    <tbody id="itemsTableBody" class="text-slate-600 text-sm divide-y divide-slate-50">
                        <!-- Dynamic data injections feed here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal Form Element Interface -->
    <div id="reportModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-xl max-w-md w-full shadow-lg">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Log New E-Waste Item</h3>
            <form id="addItemForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Item Type</label>
                    <select id="itemType" class="w-full border border-slate-200 p-2 rounded-lg text-sm bg-white focus:outline-none focus:border-emerald-500">
                        <option value="Smartphone / Tablet">Smartphone / Tablet</option>
                        <option value="Laptop / Desktop">Laptop / Desktop</option>
                        <option value="Lithium-ion Batteries">Lithium-ion Batteries</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Weight (kg)</label>
                    <input type="number" id="itemWeight" step="0.1" required class="w-full border border-slate-200 p-2 rounded-lg text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Pickup Address</label>
                    <textarea id="pickupAddress" required rows="2" class="w-full border border-slate-200 p-2 rounded-lg text-sm focus:outline-none focus:border-emerald-500" placeholder="Hostel wing, room number..."></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="document.getElementById('reportModal').classList.add('hidden')" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-100 rounded-lg">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 shadow transition-all">Submit Request</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 🔒 Secure Route Guard Enforcement Link -->
    <script type="module" src="./js/auth-guard.js"></script>

    <!-- Real-Time Firebase Cloud Operations Script -->
    <script type="module">
        import { db, collection, addDoc, onSnapshot } from "./js/firebase-config.js";
        import { getAuth, signOut } from "https://gstatic.com";

        const auth = getAuth();
        const wasteCollectionRef = collection(db, "waste_requests");

        // Cloud listener: Watches database items and calculates totals automatically
        function syncUserDashboard() {
            onSnapshot(wasteCollectionRef, (snapshot) => {
                const body = document.getElementById('itemsTableBody');
                body.innerHTML = '';

                if (snapshot.empty) {
                    body.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-slate-400">No recycled items tracked yet.</td></tr>`;
                    updateStats(0, 0);
                    return;
                }

                let totalCount = 0;
                let totalWeight = 0;

                snapshot.forEach(documentSnapshot => {
                    const item = documentSnapshot.data();
                    totalCount++;
                    totalWeight += parseFloat(item.weight || 0);

                    // Map badge colors beautifully based on state conditions
                    let statusBadgeColor = "bg-amber-100 text-amber-800";
                    if (item.status === "COLLECTED") statusBadgeColor = "bg-blue-100 text-blue-800";
                    if (item.status === "RECYCLED") statusBadgeColor = "bg-emerald-100 text-emerald-800";

                    body.innerHTML += `
                        <tr class="border-b border-slate-50 hover:bg-slate-50/50 transition-all">
                            <td class="py-3 px-4 font-medium text-slate-800">${item.type || "N/A"}</td>
                            <td class="py-3 px-4 text-slate-600">${item.weight || 0} kg</td>
                            <td class="py-3 px-4">
                                <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${statusBadgeColor}">${item.status || "PENDING"}</span>
                            </td>
                            <td class="py-3 px-4 text-slate-400">${item.date || "Just now"}</td>
                        </tr>`;
                });

                updateStats(totalCount, totalWeight);
            });
        }

        function updateStats(count, weight) {
            document.getElementById('statTotalItems').innerText = `${count} item${count !== 1 ? 's' : ''}`;
            document.getElementById('statTotalWeight').innerText = `${weight.toFixed(1)} kg`;
            document.getElementById('statPoints').innerText = `${Math.floor(weight * 10)} pts`;
        }

        // Handle structural new item creation and write straight to firestore
        document.getElementById('addItemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const today = new Date();
            const formattedDate = String(today.getDate()).padStart(2, '0') + '-' + String(today.getMonth()+1).padStart(2, '0') + '-' + today.getFullYear();
            
            try {
                await addDoc(wasteCollectionRef, {
                    type: document.getElementById('itemType').value,
                    weight: parseFloat(document.getElementById('itemWeight').value),
                    address: document.getElementById('pickupAddress').value,
                    date: formattedDate,
                    status: "PENDING"
                });
                
                document.getElementById('reportModal').classList.add('hidden');
                document.getElementById('addItemForm').reset();
            } catch (err) {
                console.error("Database write rejection: ", err);
            }
        });

        // Safe account logging termination action routine
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await signOut(auth);
                window.location.href = "index.html";
            } catch (err) {
                alert("Logout calculation failure: " + err.message);
            }
        });

        window.onload = syncUserDashboard;
    </script>
</body>
</html>
