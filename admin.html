<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jury Admin Panel - EcoTrack</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 text-slate-800 min-h-screen relative font-sans">

    <!-- Admin Navigation Banner -->
    <nav class="border-b border-slate-200 bg-white/70 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <span class="text-amber-600 text-xl"><i class="fa-solid fa-shield-halved"></i></span>
            <span class="font-bold tracking-wider text-2xl bg-gradient-to-r from-amber-600 to-orange-600 bg-clip-text text-transparent">♻️ EcoTrack Admin Panel</span>
        </div>
        <div class="flex items-center space-x-3">
            <a href="dashboard.html" class="text-sm text-slate-600 hover:text-slate-900 border border-slate-300 px-3 py-1.5 rounded-lg bg-white transition-all hover:bg-slate-50">
                <i class="fa-solid fa-arrow-left mr-1.5"></i>User View
            </a>
            <button id="adminLogoutBtn" class="text-sm text-rose-600 hover:text-rose-700 border border-rose-200 px-3 py-1.5 rounded-lg bg-rose-50 transition-all hover:bg-rose-100">
                <i class="fa-solid fa-right-from-bracket mr-1.5"></i>Logout
            </button>
        </div>
    </nav>

    <!-- Main Workspace Area -->
    <main class="max-w-6xl mx-auto p-6 relative z-10 space-y-6">
        
        <!-- Jury Tip Alert Box -->
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-blue-700 text-sm flex items-center space-x-3 shadow-sm">
            <span class="text-lg"><i class="fa-regular fa-lightbulb"></i></span>
            <div>
                <strong>Admin Tip:</strong> Real-time dashboard shows all incoming e-waste requests. Click "Advance Status" to mark items as collected.
            </div>
        </div>

        <!-- Administrative Table Management Grid -->
        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-md">
            <div class="mb-6">
                <h2 class="text-lg font-bold text-amber-700"><i class="fa-solid fa-truck-ramp-box mr-2"></i>E-Waste Processing Pipeline</h2>
                <p class="text-sm text-slate-600 mt-1">Manage incoming submissions and track collection status.</p>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-700 text-xs uppercase tracking-wider bg-slate-50">
                            <th class="pb-3 px-4 font-semibold">Request ID</th>
                            <th class="pb-3 px-4 font-semibold">Category</th>
                            <th class="pb-3 px-4 font-semibold">Weight</th>
                            <th class="pb-3 px-4 font-semibold">Current Status</th>
                            <th class="pb-3 px-4 text-right font-semibold">Action</th>
                        </tr>
                    </thead>
                    <!-- ✅ FIXED: This dynamic body container hooks straight into Google Cloud Firebase -->
                    <tbody id="adminLedgerBody" class="divide-y divide-slate-100">
                        <!-- Administrative data rows inject automatically here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Real-Time Administrative Pipeline Verification Sync Script -->
    <script type="module">
        import { auth, db, collection, onSnapshot, doc, updateDoc } from "./js/firebase-config.js";
        import { signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

        const wasteCollectionRef = collection(db, "waste_requests");

        function listenToAdminCloud() {
            onSnapshot(wasteCollectionRef, (snapshot) => {
                const body = document.getElementById('adminLedgerBody');
                body.innerHTML = '';

                // Handle completely empty collection loops gracefully
                if(snapshot.empty) {
                    body.innerHTML = `
                        <tr>
                            <td colspan="5" class="py-8 text-center text-sm text-slate-500">
                                <i class="fa-solid fa-inbox block text-2xl mb-2 text-slate-600"></i>
                                No active incoming e-waste tickets in queue.
                            </td>
                        </tr>`;
                    return;
                }

                snapshot.forEach(documentSnapshot => {
                    const item = documentSnapshot.data();
                    const docId = documentSnapshot.id;
                    
                    const itemType = item.type || "Unknown Component";
                    const itemWeight = item.weight || 0;
                    const currentStatus = item.status || "PENDING";

                    // Define design badge variables clearly based on string conditions
                    const statusStyles = currentStatus === 'PENDING' 
                        ? 'text-amber-700 border-amber-200 bg-amber-50' 
                        : 'text-emerald-700 border-emerald-200 bg-emerald-50';

                    const actionButton = currentStatus === 'PENDING' 
                        ? `<button id="btn-${docId}" class="text-xs font-bold text-white bg-amber-600 hover:bg-amber-700 px-3 py-1.5 rounded-lg shadow transition-all active:scale-95">Advance Status ➡️</button>`
                        : `<span class="inline-flex text-emerald-700 font-semibold text-xs bg-emerald-100 border border-emerald-200 px-2.5 py-1 rounded-lg"><i class="fa-solid fa-check mr-1.5 mt-0.5"></i>Collected</span>`;

                    body.innerHTML += `
                        <tr class="border-b border-slate-200 hover:bg-slate-50 transition-all">
                            <td class="py-4 px-4 font-mono text-xs text-slate-600">${docId.substring(0,6).toUpperCase()}</td>
                            <td class="py-4 px-4 font-medium text-slate-800">${itemType}</td>
                            <td class="py-4 px-4 text-slate-700">${itemWeight} kg</td>
                            <td class="py-4 px-4">
                                <span class="inline-flex items-center px-2.5 py-0.5 text-xs border font-semibold rounded-lg ${statusStyles}">${currentStatus.toLowerCase()}</span>
                            </td>
                            <td class="py-4 px-4 text-right" id="cell-${docId}">${actionButton}</td>
                        </tr>`;
                });

                // Attach isolated async events securely to dynamically generated pipeline elements
                snapshot.forEach(documentSnapshot => {
                    const docId = documentSnapshot.id;
                    const btn = document.getElementById(`btn-${docId}`);
                    if (btn) {
                        btn.onclick = async () => {
                            try {
                                const targetDocRef = doc(db, "waste_requests", docId);
                                await updateDoc(targetDocRef, { status: "COLLECTED" });
                            } catch (err) {
                                console.error("Cloud mutation rejection workflow error: ", err);
                            }
                        };
                    }
                });
            });
        }

        // Admin Logout Handler
        document.getElementById('adminLogoutBtn').addEventListener('click', async () => {
            try {
                await signOut(auth);
                window.location.href = "index.html";
            } catch (err) {
                alert("Logout failed: " + err.message);
            }
        });

        window.onload = listenToAdminCloud;
    </script>
</body>
</html>
