<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jury Admin Panel - EcoTrack</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 text-slate-800 min-h-screen relative font-sans">

    <!-- Admin Navigation Banner -->
    <nav class="border-b border-slate-200 bg-white/70 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <span class="text-amber-600 text-xl"><i class="fa-solid fa-shield-halved"></i></span>
            <span class="font-bold tracking-wider text-2xl bg-gradient-to-r from-amber-600 to-orange-600 bg-clip-text text-transparent">♻️ EcoTrack Admin Panel</span>
        </div>
        <div class="flex items-center space-x-3">
            <a href="dashboard.html" class="text-sm text-slate-600 hover:text-slate-900 border border-slate-300 px-3 py-1.5 rounded-lg bg-white transition-all hover:bg-slate-50">
                <i class="fa-solid fa-arrow-left mr-1.5"></i>User View
            </a>
            <button id="adminLogoutBtn" class="text-sm text-rose-600 hover:text-rose-700 border border-rose-200 px-3 py-1.5 rounded-lg bg-rose-50 transition-all hover:bg-rose-100">
                <i class="fa-solid fa-right-from-bracket mr-1.5"></i>Logout
            </button>
        </div>
    </nav>

    <!-- Main Workspace Area -->
    <main class="max-w-6xl mx-auto p-6 relative z-10 space-y-6">
        
        <!-- Jury Tip Alert Box -->
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-blue-700 text-sm flex items-center space-x-3 shadow-sm">
            <span class="text-lg"><i class="fa-regular fa-lightbulb"></i></span>
            <div>
                <strong>Admin Tip:</strong> Real-time dashboard shows all incoming e-waste requests. Click "Advance Status" to mark items as collected.
            </div>
        </div>

        <!-- Administrative Table Management Grid -->
        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-md">
            <div class="mb-6">
                <h2 class="text-lg font-bold text-amber-700"><i class="fa-solid fa-truck-ramp-box mr-2"></i>E-Waste Processing Pipeline</h2>
                <p class="text-sm text-slate-600 mt-1">Manage incoming submissions and track collection status.</p>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-700 text-xs uppercase tracking-wider bg-slate-50">
                            <th class="pb-3 px-4 font-semibold">Request ID</th>
                            <th class="pb-3 px-4 font-semibold">Category</th>
                            <th class="pb-3 px-4 font-semibold">Weight</th>
                            <th class="pb-3 px-4 font-semibold">Current Status</th>
                            <th class="pb-3 px-4 text-right font-semibold">Action</th>
                        </tr>
                    </thead>
                    <!-- ✅ FIXED: This dynamic body container hooks straight into Google Cloud Firebase -->
                    <tbody id="adminLedgerBody" class="divide-y divide-slate-100">
                        <!-- Administrative data rows inject automatically here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Real-Time Administrative Pipeline Verification Sync Script -->
    <script type="module">
        import { auth, db, collection, onSnapshot, doc, updateDoc } from "./js/firebase-config.js";
        import { signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

        const wasteCollectionRef = collection(db, "waste_requests");

        function listenToAdminCloud() {
            onSnapshot(wasteCollectionRef, (snapshot) => {
                const body = document.getElementById('adminLedgerBody');
                body.innerHTML = '';

                let totalRequests = 0;
                let activePickups = 0;
                let recoveredWeight = 0;
                let pendingCount = 0;
                let transitCount = 0;
                let recycledCount = 0;

                if(snapshot.empty) {
                    document.getElementById('adminTotalReq').innerText = '0';
                    document.getElementById('adminActivePickups').innerText = '0';
                    document.getElementById('adminRecoveredWeight').innerText = '0 kg';
                    document.getElementById('adminCarbonSaved').innerText = '0 kg';
                    document.getElementById('pendingRatio').innerText = '0%';
                    document.getElementById('transitRatio').innerText = '0%';
                    document.getElementById('recycledRatio').innerText = '0%';
                    document.getElementById('pendingBar').style.width = '0%';
                    document.getElementById('transitBar').style.width = '0%';
                    document.getElementById('recycledBar').style.width = '0%';

                    body.innerHTML = `
                        <tr>
                            <td colspan="6" class="py-8 text-center text-sm text-slate-500">
                                <i class="fa-solid fa-inbox block text-2xl mb-2 text-slate-600"></i>
                                No active incoming e-waste tickets in queue.
                            </td>
                        </tr>`;
                    return;
                }

                snapshot.forEach(documentSnapshot => {
                    totalRequests++;
                    const item = documentSnapshot.data();
                    const docId = documentSnapshot.id;
                    const itemType = item.type || "Unknown Component";
                    const itemWeight = parseFloat(item.weight || 0);
                    const currentStatus = item.status || "PENDING";
                    const requesterEmail = item.userEmail || "Unknown user";
                    const etaValue = item.estimatedPickupTime || "";
                    recoveredWeight += itemWeight;

                    if (currentStatus === 'PENDING') pendingCount++;
                    if (currentStatus === 'ASSIGNED' || currentStatus === 'IN_TRANSIT') transitCount++;
                    if (currentStatus === 'COLLECTED' || currentStatus === 'RECYCLED') recycledCount++;
                    if (currentStatus === 'ASSIGNED' || currentStatus === 'IN_TRANSIT' || currentStatus === 'COLLECTED') activePickups++;

                    const statusStyles = currentStatus === 'PENDING'
                        ? 'text-amber-700 border-amber-200 bg-amber-50'
                        : currentStatus === 'ASSIGNED'
                            ? 'text-blue-700 border-blue-200 bg-blue-50'
                            : currentStatus === 'IN_TRANSIT'
                                ? 'text-violet-700 border-violet-200 bg-violet-50'
                                : 'text-emerald-700 border-emerald-200 bg-emerald-50';

                    const etaDisplay = etaValue ? new Date(etaValue).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : 'Not scheduled';

                    body.innerHTML += `
                        <tr class="border-b border-slate-200 hover:bg-slate-50 transition-all align-top">
                            <td class="py-4 px-4 font-mono text-xs text-slate-600">${docId.substring(0,6).toUpperCase()}</td>
                            <td class="py-4 px-4 text-slate-800">
                                <div class="font-medium">${requesterEmail}</div>
                                <div class="text-xs text-slate-500 mt-1">${itemType}</div>
                            </td>
                            <td class="py-4 px-4 text-slate-700">${itemWeight} kg</td>
                            <td class="py-4 px-4">
                                <span class="inline-flex items-center px-2.5 py-0.5 text-xs border font-semibold rounded-lg ${statusStyles}">${currentStatus}</span>
                            </td>
                            <td class="py-4 px-4 text-slate-600 text-xs">${etaDisplay}</td>
                            <td class="py-4 px-4 text-right">
                                <div class="flex flex-col gap-2 items-end">
                                    <select data-docid="${docId}" class="status-select w-full max-w-[180px] border border-slate-200 rounded-lg px-2 py-1.5 text-xs bg-white text-slate-700 focus:outline-none focus:border-amber-500">
                                        <option value="PENDING" ${currentStatus === 'PENDING' ? 'selected' : ''}>PENDING</option>
                                        <option value="ASSIGNED" ${currentStatus === 'ASSIGNED' ? 'selected' : ''}>ASSIGNED</option>
                                        <option value="IN_TRANSIT" ${currentStatus === 'IN_TRANSIT' ? 'selected' : ''}>IN_TRANSIT</option>
                                        <option value="COLLECTED" ${currentStatus === 'COLLECTED' ? 'selected' : ''}>COLLECTED</option>
                                        <option value="RECYCLED" ${currentStatus === 'RECYCLED' ? 'selected' : ''}>RECYCLED</option>
                                    </select>
                                    <input type="datetime-local" data-docid="${docId}" class="eta-input w-full max-w-[180px] border border-slate-200 rounded-lg px-2 py-1.5 text-xs bg-white text-slate-700 focus:outline-none focus:border-amber-500" value="${etaValue ? etaValue.slice(0, 16) : ''}" aria-label="Estimated pickup time">
                                </div>
                            </td>
                        </tr>`;
                });

                const pendingPercent = (pendingCount / totalRequests) * 100 || 0;
                const transitPercent = (transitCount / totalRequests) * 100 || 0;
                const recycledPercent = (recycledCount / totalRequests) * 100 || 0;

                document.getElementById('adminTotalReq').innerText = totalRequests;
                document.getElementById('adminActivePickups').innerText = activePickups;
                document.getElementById('adminRecoveredWeight').innerText = `${recoveredWeight.toFixed(1)} kg`;
                document.getElementById('adminCarbonSaved').innerText = `${(recoveredWeight * 1.8).toFixed(1)} kg`;
                document.getElementById('pendingRatio').innerText = `${pendingPercent.toFixed(0)}%`;
                document.getElementById('transitRatio').innerText = `${transitPercent.toFixed(0)}%`;
                document.getElementById('recycledRatio').innerText = `${recycledPercent.toFixed(0)}%`;
                document.getElementById('pendingBar').style.width = `${pendingPercent}%`;
                document.getElementById('transitBar').style.width = `${transitPercent}%`;
                document.getElementById('recycledBar').style.width = `${recycledPercent}%`;

                document.querySelectorAll('.status-select').forEach((select) => {
                    select.addEventListener('change', async (event) => {
                        const docId = event.target.dataset.docid;
                        const nextStatus = event.target.value;
                        const etaInput = document.querySelector(`.eta-input[data-docid="${docId}"]`);
                        const nextEta = etaInput ? etaInput.value : '';

                        try {
                            const targetDocRef = doc(db, 'waste_requests', docId);
                            await updateDoc(targetDocRef, {
                                status: nextStatus,
                                estimatedPickupTime: nextEta ? new Date(nextEta).toISOString() : ''
                            });
                        } catch (err) {
                            console.error('Cloud mutation rejection workflow error: ', err);
                        }
                    });
                });

                document.querySelectorAll('.eta-input').forEach((input) => {
                    input.addEventListener('change', async (event) => {
                        const docId = event.target.dataset.docid;
                        const etaValue = event.target.value;
                        const statusSelect = document.querySelector(`.status-select[data-docid="${docId}"]`);
                        const nextStatus = statusSelect ? statusSelect.value : 'PENDING';

                        try {
                            const targetDocRef = doc(db, 'waste_requests', docId);
                            await updateDoc(targetDocRef, {
                                status: nextStatus,
                                estimatedPickupTime: etaValue ? new Date(etaValue).toISOString() : ''
                            });
                        } catch (err) {
                            console.error('ETA update failed: ', err);
                        }
                    });
                });
            });
        }

        // Admin Logout Handler
        document.getElementById('adminLogoutBtn').addEventListener('click', async () => {
            try {
                await signOut(auth);
                window.location.href = "index.html";
            } catch (err) {
                alert("Logout failed: " + err.message);
            }
        });

        window.onload = listenToAdminCloud;
    </script>
</body>
</html>
