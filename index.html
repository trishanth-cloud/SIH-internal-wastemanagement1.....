<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrace - Portal Gateway</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen flex items-center justify-center relative overflow-hidden font-sans">

    <!-- Ambient Glow Layout Assets -->
    <div class="absolute w-[500px] h-[500px] bg-emerald-500/10 rounded-full blur-[120px] top-[-10%] left-[-10%] animate-pulse"></div>
    <div class="absolute w-[400px] h-[400px] bg-blue-500/10 rounded-full blur-[100px] bottom-[-10%] right-[-10%]"></div>

    <!-- Dual Authentication Panel Container -->
    <div class="w-full max-w-4xl mx-4 relative z-10 grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- USER LOGIN PANEL -->
        <div class="bg-[#1e293b]/60 backdrop-blur-md border border-slate-700/50 p-8 rounded-2xl shadow-2xl">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-500/10 border border-emerald-500/30 rounded-xl mb-4 text-emerald-400 text-2xl shadow-inner shadow-emerald-500/5">
                    <i class="fa-solid fa-leaf"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-emerald-400 to-blue-400 bg-clip-text text-transparent">EcoTrace User</h1>
                <p class="text-sm text-slate-400 mt-1">Recycle & Track Items</p>
            </div>

            <!-- User Login Form -->
            <form id="userAuthForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input id="userEmail" type="email" required placeholder="your@email.com" 
                            class="w-full bg-[#0f172a]/80 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all duration-200">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input id="userPassword" type="password" required placeholder="••••••••" 
                            class="w-full bg-[#0f172a]/80 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all duration-200">
                    </div>
                </div>

                <button type="submit" id="userSubmitBtn"
                    class="w-full bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-slate-900 font-bold py-3 rounded-xl shadow-lg shadow-emerald-500/10 active:scale-[0.98] transition-all duration-150">
                    <span>Login as User</span>
                </button>
            </form>

            <div class="mt-6 text-center text-xs">
                <button id="userToggleBtn" class="text-emerald-400 hover:text-emerald-300 underline font-medium focus:outline-none">
                    New here? Create Account
                </button>
            </div>
        </div>

        <!-- ADMIN LOGIN PANEL -->
        <div class="bg-[#1e293b]/60 backdrop-blur-md border border-slate-700/50 p-8 rounded-2xl shadow-2xl">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-500/10 border border-amber-500/30 rounded-xl mb-4 text-amber-400 text-2xl shadow-inner shadow-amber-500/5">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-amber-400 to-orange-400 bg-clip-text text-transparent">Admin Portal</h1>
                <p class="text-sm text-slate-400 mt-1">Manage & Process Items</p>
            </div>

            <!-- Admin Login Form -->
            <form id="adminAuthForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Admin Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input id="adminEmail" type="email" required placeholder="admin@college.edu" 
                            class="w-full bg-[#0f172a]/80 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all duration-200">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Admin Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input id="adminPassword" type="password" required placeholder="••••••••" 
                            class="w-full bg-[#0f172a]/80 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all duration-200">
                    </div>
                </div>

                <button type="submit" id="adminSubmitBtn"
                    class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-slate-900 font-bold py-3 rounded-xl shadow-lg shadow-amber-500/10 active:scale-[0.98] transition-all duration-150">
                    <span>Admin Login</span>
                </button>
            </form>

            <div class="mt-6 text-center text-xs">
                <button id="adminToggleBtn" class="text-amber-400 hover:text-amber-300 underline font-medium focus:outline-none">
                    New admin? Register
                </button>
            </div>
        </div>
    </div>

    <!-- Dual Authentication Script Bridge -->
    <script type="module">
        import { auth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "./js/firebase-config.js";

        // USER AUTHENTICATION HANDLER
        let userIsLoginMode = true;
        const userAuthForm = document.getElementById('userAuthForm');
        const userToggleBtn = document.getElementById('userToggleBtn');
        const userSubmitBtn = document.getElementById('userSubmitBtn');

        userToggleBtn.addEventListener('click', () => {
            userIsLoginMode = !userIsLoginMode;
            if (userIsLoginMode) {
                userSubmitBtn.innerHTML = '<span>Login as User</span>';
                userToggleBtn.innerText = 'New here? Create Account';
            } else {
                userSubmitBtn.innerHTML = '<span>Create User Account</span>';
                userToggleBtn.innerText = 'Already have account? Login';
            }
        });

        userAuthForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailValue = document.getElementById('userEmail').value.trim();
            const passwordValue = document.getElementById('userPassword').value;

            try {
                if (userIsLoginMode) {
                    await signInWithEmailAndPassword(auth, emailValue, passwordValue);
                    window.location.href = 'dashboard.html';
                } else {
                    await createUserWithEmailAndPassword(auth, emailValue, passwordValue);
                    alert("Account created! Logging you in...");
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                alert("User Auth Error: " + error.message.replace("Firebase: ", ""));
            }
        });

        // ADMIN AUTHENTICATION HANDLER
        let adminIsLoginMode = true;
        const adminAuthForm = document.getElementById('adminAuthForm');
        const adminToggleBtn = document.getElementById('adminToggleBtn');
        const adminSubmitBtn = document.getElementById('adminSubmitBtn');

        adminToggleBtn.addEventListener('click', () => {
            adminIsLoginMode = !adminIsLoginMode;
            if (adminIsLoginMode) {
                adminSubmitBtn.innerHTML = '<span>Admin Login</span>';
                adminToggleBtn.innerText = 'New admin? Register';
            } else {
                adminSubmitBtn.innerHTML = '<span>Register Admin Account</span>';
                adminToggleBtn.innerText = 'Already admin? Login';
            }
        });

        adminAuthForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailValue = document.getElementById('adminEmail').value.trim();
            const passwordValue = document.getElementById('adminPassword').value;

            // Verify admin email pattern
            if (!emailValue.toLowerCase().includes('admin')) {
                alert("Admin login requires 'admin' in email address");
                return;
            }

            try {
                if (adminIsLoginMode) {
                    await signInWithEmailAndPassword(auth, emailValue, passwordValue);
                    window.location.href = 'admin.html';
                } else {
                    await createUserWithEmailAndPassword(auth, emailValue, passwordValue);
                    alert("Admin account created! Logging you in...");
                    window.location.href = 'admin.html';
                }
            } catch (error) {
                alert("Admin Auth Error: " + error.message.replace("Firebase: ", ""));
            }
        });
    </script>
</body>
</html>
