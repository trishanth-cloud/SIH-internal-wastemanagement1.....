<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Waste Tracker - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-emerald-600 tracking-tight">♻️ EcoTrack</h1>
            <p class="text-slate-500 mt-2 text-sm">Smart India Hackathon Prototype</p>
        </div>
        <form action="dashboard.html" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Email Address</label>
                <input type="email" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-emerald-500" placeholder="name@college.edu">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-emerald-500" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-emerald-600 text-white font-medium py-2.5 rounded-lg hover:bg-emerald-700 transition">Sign In</button>
        </form>
        <p class="text-center text-xs text-slate-400 mt-6">SIH 2026 Internal Hackathon Submission</p>
    </div>
</body>
</html>
