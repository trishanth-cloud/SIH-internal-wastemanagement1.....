<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - EcoTrace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen overflow-y-auto py-8 font-sans">

    <div class="absolute w-[500px] h-[500px] bg-emerald-500/10 rounded-full blur-[120px] top-[-10%] left-[-10%] animate-pulse"></div>
    <div class="absolute w-[400px] h-[400px] bg-blue-500/10 rounded-full blur-[100px] bottom-[-10%] right-[-10%]"></div>

    <div class="w-full max-w-md mx-4 bg-[#1e293b]/60 backdrop-blur-md border border-slate-700/50 p-8 rounded-2xl shadow-2xl relative z-10">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-500/10 border border-emerald-500/30 rounded-xl mb-4 text-emerald-400 text-2xl">
                <i class="fa-solid fa-leaf"></i>
            </div>
            <h1 id="userTitle" class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-blue-400 bg-clip-text text-transparent">User Login</h1>
            <p id="userSub" class="text-sm text-slate-400 mt-1">Recycle & Track Items</p>
        </div>

        <form id="userForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input id="userEmail" type="email" required placeholder="your@email.com" 
                        class="w-full bg-[#0f172a]/80 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input id="userPassword" type="password" required placeholder="••••••••" 
                        class="w-full bg-[#0f172a]/80 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
                </div>
            </div>

            <button type="submit" id="userSubmitBtn" class="w-full bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-slate-900 font-bold py-3 rounded-xl shadow-lg">
                Login
            </button>
        </form>

        <div class="mt-6 text-center text-xs space-y-3">
            <button id="userToggleBtn" class="block w-full text-emerald-400 hover:text-emerald-300 underline font-medium">
                Don't have account? Register
            </button>
            <a href="index.html" class="block text-slate-400 hover:text-slate-200">
                <i class="fa-solid fa-arrow-left mr-1.5"></i>Back to Portal
            </a>
        </div>
    </div>

    <script type="module">
        import { auth, createUserWithEmailAndPassword, signInWithEmailAndPassword, db, setDoc, doc } from "./js/firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

        let isUserLogin = true;
        const userForm = document.getElementById('userForm');
        const userToggleBtn = document.getElementById('userToggleBtn');
        const userSubmitBtn = document.getElementById('userSubmitBtn');
        const userTitle = document.getElementById('userTitle');
        const userSub = document.getElementById('userSub');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });

        userToggleBtn.addEventListener('click', () => {
            isUserLogin = !isUserLogin;
            if (isUserLogin) {
                userTitle.innerText = "User Login";
                userSub.innerText = "Recycle & Track Items";
                userSubmitBtn.innerText = "Login";
                userToggleBtn.innerText = "Don't have account? Register";
            } else {
                userTitle.innerText = "User Register";
                userSub.innerText = "Create Your Account";
                userSubmitBtn.innerText = "Create Account";
                userToggleBtn.innerText = "Already have account? Login";
            }
        });

        userForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('userEmail').value.trim();
            const password = document.getElementById('userPassword').value;

            try {
                if (isUserLogin) {
                    const result = await signInWithEmailAndPassword(auth, email, password);
                    if (result?.user) {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    const userCred = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "users", userCred.user.uid), {
                        email: email,
                        uid: userCred.user.uid,
                        role: "user",
                        createdAt: new Date()
                    });
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                alert("Error: " + error.message.replace("Firebase: ", ""));
            }
        });
    </script>
</body>
</html>
