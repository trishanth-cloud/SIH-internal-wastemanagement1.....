<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - EcoTrace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen flex items-center justify-center relative overflow-hidden font-sans">

    <div class="absolute w-[500px] h-[500px] bg-amber-500/10 rounded-full blur-[120px] top-[-10%] left-[-10%] animate-pulse"></div>
    <div class="absolute w-[400px] h-[400px] bg-orange-500/10 rounded-full blur-[100px] bottom-[-10%] right-[-10%]"></div>

    <div class="w-full max-w-md mx-4 bg-[#1e293b]/60 backdrop-blur-md border border-slate-700/50 p-8 rounded-2xl shadow-2xl relative z-10">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-500/10 border border-amber-500/30 rounded-xl mb-4 text-amber-400 text-2xl">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 id="adminTitle" class="text-2xl font-bold bg-gradient-to-r from-amber-400 to-orange-400 bg-clip-text text-transparent">Admin Login</h1>
            <p id="adminSub" class="text-sm text-slate-400 mt-1">Manage & Process Items</p>
        </div>

        <form id="adminForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input id="adminEmail" type="email" required placeholder="admin@college.edu" 
                        class="w-full bg-[#0f172a]/80 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input id="adminPassword" type="password" required placeholder="••••••••" 
                        class="w-full bg-[#0f172a]/80 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500">
                </div>
            </div>

            <button type="submit" id="adminSubmitBtn" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-slate-900 font-bold py-3 rounded-xl shadow-lg">
                Admin Login
            </button>
        </form>

        <div class="mt-6 text-center text-xs space-y-3">
            <button id="adminToggleBtn" class="block w-full text-amber-400 hover:text-amber-300 underline font-medium">
                New admin? Register
            </button>
            <a href="index.html" class="block text-slate-400 hover:text-slate-200">
                <i class="fa-solid fa-arrow-left mr-1.5"></i>Back to Portal
            </a>
        </div>
    </div>

    <script type="module">
        import { auth, createUserWithEmailAndPassword, signInWithEmailAndPassword, db, collection, setDoc, doc } from "./js/firebase-config.js";

        let isAdminLogin = true;
        const adminForm = document.getElementById('adminForm');
        const adminToggleBtn = document.getElementById('adminToggleBtn');
        const adminSubmitBtn = document.getElementById('adminSubmitBtn');
        const adminTitle = document.getElementById('adminTitle');
        const adminSub = document.getElementById('adminSub');

        adminToggleBtn.addEventListener('click', () => {
            isAdminLogin = !isAdminLogin;
            if (isAdminLogin) {
                adminTitle.innerText = "Admin Login";
                adminSub.innerText = "Manage & Process Items";
                adminSubmitBtn.innerText = "Admin Login";
                adminToggleBtn.innerText = "New admin? Register";
            } else {
                adminTitle.innerText = "Admin Register";
                adminSub.innerText = "Create Admin Account";
                adminSubmitBtn.innerText = "Create Admin";
                adminToggleBtn.innerText = "Already admin? Login";
            }
        });

        adminForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;

            try {
                if (isAdminLogin) {
                    await signInWithEmailAndPassword(auth, email, password);
                    window.location.href = 'admin.html';
                } else {
                    const adminCred = await createUserWithEmailAndPassword(auth, email, password);
                    // Store admin in admins collection
                    await setDoc(doc(collection(db, "admins"), adminCred.user.uid), {
                        email: email,
                        uid: adminCred.user.uid,
                        role: "admin",
                        createdAt: new Date()
                    });
                    alert("Admin account created! Logging you in...");
                    window.location.href = 'admin.html';
                }
            } catch (error) {
                alert("Error: " + error.message.replace("Firebase: ", ""));
            }
        });
    </script>
</body>
</html>
