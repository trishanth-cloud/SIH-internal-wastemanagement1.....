<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - EcoTrace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans relative overflow-x-hidden selection:bg-amber-500 selection:text-slate-950">

    <div class="fixed w-[500px] h-[500px] bg-amber-500/10 rounded-full blur-[120px] -top-32 -left-32 pointer-events-none animate-pulse"></div>
    <div class="fixed w-[400px] h-[400px] bg-orange-600/10 rounded-full blur-[100px] -bottom-32 -right-32 pointer-events-none"></div>

    <main class="w-full max-w-md bg-slate-900/60 backdrop-blur-xl border border-slate-800 p-8 rounded-3xl shadow-2xl relative z-10 transition-all duration-300">
        
        <header class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-500/10 border border-amber-500/20 rounded-2xl mb-4 text-amber-400 text-2xl shadow-inner">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 id="adminTitle" class="text-2xl font-bold bg-gradient-to-r from-amber-400 to-orange-400 bg-clip-text text-transparent">
                Admin Login
            </h1>
            <p id="adminSub" class="text-xs text-slate-400 mt-1">
                Manage & Process Items
            </p>
        </header>

        <div id="errorBanner" class="hidden mb-6 p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-xs text-center flex items-center justify-center gap-2">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="errorMessage">An error occurred.</span>
        </div>

        <form id="adminForm" class="space-y-5">
            <div>
                <label for="adminEmail" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input id="adminEmail" type="email" required placeholder="admin@ecotrace.org" 
                        class="w-full bg-slate-950/80 border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors">
                </div>
            </div>

            <div>
                <label for="adminPassword" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input id="adminPassword" type="password" required placeholder="••••••••" 
                        class="w-full bg-slate-950/80 border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors">
                </div>
            </div>

            <button type="submit" id="adminSubmitBtn" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-bold py-3 rounded-xl shadow-lg shadow-amber-500/10 active:scale-[0.99] transition-all flex items-center justify-center">
                <span>Admin Login</span>
            </button>
        </form>

        <footer class="mt-6 text-center text-xs space-y-3">
            <button id="adminToggleBtn" class="block w-full text-amber-400 hover:text-amber-300 underline font-medium transition-colors">
                New admin? Register
            </button>
            <a href="index.html" class="inline-flex items-center text-slate-400 hover:text-slate-200 transition-colors mt-2">
                <i class="fa-solid fa-arrow-left mr-1.5"></i> Back to Portal
            </a>
        </footer>
    </main>

    <script type="module">
        import { auth, createUserWithEmailAndPassword, signInWithEmailAndPassword, db, setDoc, doc } from "./js/firebase-config.js";

        let isAdminLogin = true;

        const adminForm = document.getElementById('adminForm');
        const adminToggleBtn = document.getElementById('adminToggleBtn');
        const adminSubmitBtn = document.getElementById('adminSubmitBtn');
        const adminTitle = document.getElementById('adminTitle');
        const adminSub = document.getElementById('adminSub');
        const errorBanner = document.getElementById('errorBanner');
        const errorMessage = document.getElementById('errorMessage');

        function showError(msg) {
            errorMessage.innerText = msg;
            errorBanner.classList.remove('hidden');
        }

        function hideError() {
            errorBanner.classList.add('hidden');
        }

        function setLoading(isLoading) {
            if (isLoading) {
                adminSubmitBtn.disabled = true;
                adminSubmitBtn.classList.add('opacity-75', 'cursor-not-allowed');
                adminSubmitBtn.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin mr-2"></i> Processing...`;
            } else {
                adminSubmitBtn.disabled = false;
                adminSubmitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                adminSubmitBtn.innerText = isAdminLogin ? "Admin Login" : "Create Admin";
            }
        }

        adminToggleBtn.addEventListener('click', () => {
            hideError();
            isAdminLogin = !isAdminLogin;
            if (isAdminLogin) {
                adminTitle.innerText = "Admin Login";
                adminSub.innerText = "Manage & Process Items";
                adminSubmitBtn.innerText = "Admin Login";
                adminToggleBtn.innerText = "New admin? Register";
            } else {
                adminTitle.innerText = "Admin Register";
                adminSub.innerText = "Create Admin Account";
                adminSubmitBtn.innerText = "Create Admin";
                adminToggleBtn.innerText = "Already admin? Login";
            }
        });

        adminForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;

            setLoading(true);

            try {
                if (isAdminLogin) {
                    await signInWithEmailAndPassword(auth, email, password);
                    window.location.href = 'admin.html';
                } else {
                    const adminCred = await createUserWithEmailAndPassword(auth, email, password);
                    
                    await setDoc(doc(db, "admins", adminCred.user.uid), {
                        email: email,
                        uid: adminCred.user.uid,
                        role: "admin",
                        createdAt: new Date()
                    });
                    
                    window.location.href = 'admin.html';
                }
            } catch (error) {
                const formattedError = error.message.replace("Firebase: ", "").replace(/auth\//, '');
                showError(formattedError);
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
